name: Test

on: [push]

jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v2
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
    - name: Install dependencies
      run: uv sync
    - name: Run ruff format
      run: uv run ruff format --check .
    - name: Run ruff check
      run: uv run ruff check .
    - name: Test with pytest
      run: make test
