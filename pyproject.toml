[project]
name = "tensorpack"
version = "0.1.2"
description = "A collection of tensor methods from the Meyer lab."
authors = [{ name = "Cyrillus Tan", email = "cyztan@gmail.com" }]
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.21",
    "tensorly>=0.8",
    "matplotlib>=3.5.0",
    "tqdm>=4.62.3",
    "seaborn>=0.11.2",
    "drawsvg>=2.4",
    "xarray>=2024",
    "scikit-learn>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0.0",
    "tensordata",
    "pyright>=1.1.379",
    "ruff>=0.6.4",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
# Pinned to the last commit before tensordata required Python 3.14, which is
# newer than tensorpack's supported range (requires-python above).
tensordata = { git = "https://github.com/meyer-lab/tensordata.git", rev = "7c52287" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tensorpack"]

[tool.pytest.ini_options]
addopts = "-n auto"
testpaths = ["tensorpack"]
filterwarnings = [
    "error",
    # xarray (third party) triggers this on import under NumPy >= 2.
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    # NMF initialization on random dense data legitimately hits max_iter.
    "ignore:Maximum number of iterations .* reached:sklearn.exceptions.ConvergenceWarning",
]
